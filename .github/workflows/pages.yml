name: Deploy to GitHub Pages
# Prefer the local script:  npm run deploy:preview
# (GitHub Actions runners for this repo were failing to schedule jobs on 2026-11-09;
# preview currently publishes from the gh-pages branch.)
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        env:
          BASE: ${{ vars.SITE_BASE }}
          PUBLISH_CNAME: ${{ vars.PUBLISH_CNAME }}
        run: |
          export BASE="${BASE:-/}"
          # CNAME stays out of dist unless PUBLISH_CNAME=1 (see GO-LIVE.md).
          node build.mjs --hide-todos
          if [ -n "$BASE" ] && [ "$BASE" != "/" ]; then rm -f dist/CNAME; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
